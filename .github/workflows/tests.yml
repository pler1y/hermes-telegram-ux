name: Tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  regression:
    strategy:
      fail-fast: false
      matrix:
        include:
          - core: b499ab11fe8b081470e269f2fb27abae03000da5
            validator: ''
          - core: a84a2223f82c3d9906fd4a9d778a188774e7a08e
            validator: '--require-validator'
          - core: 436ec489854b7110b4c5506b1f52c514fa4c3ace
            validator: '--require-validator'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          path: ux
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: NousResearch/hermes-agent
          ref: ${{ matrix.core }}
          path: hermes-core
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install isolated pinned core environment
        run: |
          python -m pip install uv
          cd hermes-core
          uv sync --frozen --no-dev --no-install-project --python 3.11
          uv pip install --python .venv/bin/python 'python-telegram-bot==22.8'
      - name: Full regression and native discovery
        working-directory: ux
        run: |
          export PYTHONPATH="$GITHUB_WORKSPACE/hermes-core"
          "$GITHUB_WORKSPACE/hermes-core/.venv/bin/python" scripts/run_tests.py
          "$GITHUB_WORKSPACE/hermes-core/.venv/bin/python" scripts/check_runtime.py
          "$GITHUB_WORKSPACE/hermes-core/.venv/bin/python" scripts/check_native_install.py ${{ matrix.validator }}
          "$GITHUB_WORKSPACE/hermes-core/.venv/bin/python" scripts/build_release.py --check
          "$GITHUB_WORKSPACE/hermes-core/.venv/bin/python" scripts/check_editions.py
  upstream-compatibility:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          path: ux
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: NousResearch/hermes-agent
          ref: main
          path: hermes-core
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check current upstream interfaces without importing gateway or credentials
        working-directory: ux
        run: |
          python -c 'from pathlib import Path; from plugin.compat import verify_core; print(verify_core(Path("../hermes-core")))'
