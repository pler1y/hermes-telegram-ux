name: Tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  regression:
    strategy:
      fail-fast: false
      matrix:
        include:
          - core: b499ab11fe8b081470e269f2fb27abae03000da5
            validator: ''
          - core: a84a2223f82c3d9906fd4a9d778a188774e7a08e
            validator: '--require-validator'
          - core: 436ec489854b7110b4c5506b1f52c514fa4c3ace
            validator: '--require-validator'
          - core: 044a77b3b6af4ce16138d42762f812a20b9f7a89
            validator: '--require-validator'
          - core: 5eb99eb2844b22ebb723711b8e6a0bbb80bb5f04
            validator: '--require-validator'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          path: ux
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: NousResearch/hermes-agent
          ref: ${{ matrix.core }}
          path: hermes-core
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install isolated pinned core environment
        run: |
          python -m pip install uv
          cd hermes-core
          uv sync --frozen --no-dev --no-install-project --python 3.11
          uv pip install --python .venv/bin/python 'python-telegram-bot==22.8'
      - name: Full regression and native discovery
        working-directory: ux
        run: |
          export PYTHONPATH="$GITHUB_WORKSPACE/hermes-core"
          "$GITHUB_WORKSPACE/hermes-core/.venv/bin/python" scripts/run_tests.py
          "$GITHUB_WORKSPACE/hermes-core/.venv/bin/python" scripts/check_compatibility.py --hermes-core "$GITHUB_WORKSPACE/hermes-core"
          "$GITHUB_WORKSPACE/hermes-core/.venv/bin/python" scripts/check_runtime.py
          "$GITHUB_WORKSPACE/hermes-core/.venv/bin/python" scripts/check_native_install.py ${{ matrix.validator }} --report native-report.json
          "$GITHUB_WORKSPACE/hermes-core/.venv/bin/python" scripts/build_release.py --check
          "$GITHUB_WORKSPACE/hermes-core/.venv/bin/python" scripts/check_editions.py
      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.core }}
          path: ux/native-report.json
  upstream-compatibility:
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12']
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          path: ux
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: NousResearch/hermes-agent
          ref: main
          path: hermes-core
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Check current upstream interfaces without importing gateway or credentials
        working-directory: ux
        run: |
          python scripts/check_compatibility.py --hermes-core ../hermes-core
      - name: Validate and enable on compatible upstream source
        run: |
          python -m pip install uv
          cd hermes-core
          uv sync --frozen --no-dev --no-install-project --python '${{ matrix.python }}'
          uv pip install --python .venv/bin/python 'python-telegram-bot==22.8'
          cd ../ux
          export PYTHONPATH="$GITHUB_WORKSPACE/hermes-core"
          "$GITHUB_WORKSPACE/hermes-core/.venv/bin/python" scripts/check_native_install.py --require-validator --report native-report.json
      - uses: actions/upload-artifact@v4
        with:
          name: upstream-native-python-${{ matrix.python }}
          path: ux/native-report.json
