name: hermes-telegram-ux-catalog
version: 2.1.0
description: Task-aware temporary Telegram progress with automatic cleanup through public Hermes APIs.
author: pler1y
license: MIT
homepage: https://github.com/pler1y/hermes-telegram-ux
requires_hermes: ">=0.21.0"
provides_tools:
  - telegram_ux_update
provides_middleware: []
provides_hooks:
  - pre_gateway_dispatch
  - pre_llm_call
  - pre_tool_call
  - post_tool_call
  - pre_api_request
  - post_api_request
  - api_request_error
  - pre_approval_request
  - post_approval_response
  - on_interim_message
  - post_llm_call
  - on_session_end
  - on_session_finalize
  - on_session_reset
  - subagent_start
  - subagent_stop
config_schema:
  language:
    type: str
    default: auto
    description: Status language, auto / zh / en. Auto uses current message text; ambiguous input falls back to zh. Restart after changing settings.
  update_interval:
    type: float
    default: 1.5
    description: Minimum seconds between status edits (1 to 30).
  status_ttl:
    type: float
    default: 600
    description: Stop showing live status after this many seconds without an event (30 to 3600).
  cleanup_delay:
    type: float
    default: 1.0
    description: Seconds before removing the owned status after turn completion (0 to 5); not a final-delivery receipt.
