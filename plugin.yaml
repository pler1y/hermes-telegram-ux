manifest_version: 2
name: hermes-interaction
version: 1.7.0
label: Hermes Telegram UX
description: Instant Telegram feedback, live task updates and natural controls for Hermes.
kind: standalone
license: MIT
provides_tools: [interaction_update, interaction_actions]
provides_hooks: [pre_api_request, post_api_request, api_request_error, pre_tool_call, post_tool_call, on_session_end, on_session_reset, pre_gateway_dispatch, pre_approval_request, post_approval_response, subagent_start, subagent_stop, post_llm_call]
python_dependencies:
  - PyYAML>=6,<7
  - python-telegram-bot>=22,<23
tags: [telegram, ux, progress]
config_schema:
  language:
    type: string
    default: package
    description: Fixed interface language (zh or en); package uses the downloaded edition.
  status_emoji:
    type: bool
    default: true
    description: Add a fitting emoji when a progress update has none.
  soft_wait:
    type: bool
    default: false
    description: Delay visible status until there is a substantive tool event.
  status_delay_seconds:
    type: float
    default: 0.6
    description: Fallback delay for task status when an intake acknowledgement is unavailable.
  status_min_edit_seconds:
    type: float
    default: 2.5
    description: Minimum interval between normal progress edits.
  slow_notice_seconds:
    type: float
    default: 45.0
    description: Time without a new event before displaying a waiting notice.
  text_batch_seconds:
    type: float
    default: 0.8
    description: Telegram text coalescing quiet window.
