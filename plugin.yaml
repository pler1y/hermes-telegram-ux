name: hermes-telegram-ux-catalog
version: 1.9.0-catalog.1
description: Natural Telegram progress, task menus, follow-up entry points and personal display preferences through public Hermes APIs.
author: pler1y
license: MIT
homepage: https://github.com/pler1y/hermes-telegram-ux
requires_hermes: ">=0.21.3"
provides_tools:
  - telegram_ux_update
provides_middleware: []
provides_hooks:
  - pre_gateway_dispatch
  - pre_llm_call
  - pre_tool_call
  - post_tool_call
  - pre_api_request
  - post_api_request
  - api_request_error
  - pre_approval_request
  - post_approval_response
  - on_interim_message
  - transform_llm_output
  - on_session_end
  - on_session_finalize
  - on_session_reset
  - pre_command
  - subagent_start
  - subagent_stop
config_schema:
  language:
    type: str
    default: zh
    description: Status language, zh or en. Restart the Gateway after changing settings.
  progress:
    type: bool
    default: true
    description: Show a separate status message for reliably correlated Telegram turns.
  final_summary:
    type: bool
    default: false
    description: Append observed tool and API counts to text replies that used tools.
  display:
    type: str
    default: brief
    description: Default progress detail, brief or detail. Users can override in their own chat/topic.
  emoji:
    type: bool
    default: true
    description: Show emoji in plugin status messages; does not change native reactions.
  wait_hint:
    type: bool
    default: true
    description: Show elapsed time after twenty seconds without claiming a completion percentage.
  conversation_style:
    type: bool
    default: true
    description: Add concise task communication guidance to correlated Telegram turns.
  followups:
    type: bool
    default: true
    description: Offer user-sent follow-up requests on completed status cards.
  update_interval:
    type: float
    default: 1.5
    description: Minimum seconds between status edits (1 to 30).
  status_ttl:
    type: float
    default: 600
    description: Stop showing live status after this many seconds without an event (30 to 3600).
